# ─── HTTP: ACME challenge + redirect HTTPS ────────────────────────────────────
server {
    listen 80;
    server_name pixcode.go.ro;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirecționează tot restul la HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: Reverse proxy → FastAPI :8085 ────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name pixcode.go.ro;

    ssl_certificate     /etc/letsencrypt/live/pixcode.go.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixcode.go.ro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;

    # Proxy → FastAPI
    location / {
        proxy_pass         http://app:8085;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 10M;
    }
}
