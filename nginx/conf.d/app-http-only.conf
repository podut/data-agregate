# Configurație temporară — DOAR pentru obținerea primului certificat Let's Encrypt
# Înlocuiește app.conf cu acesta ÎNAINTE de primul "docker compose up"
# Apoi revino la app.conf după ce rulezi init-ssl.sh

server {
    listen 80;
    server_name pixcode.go.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://app:8085;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
